spring:
  application:
    name: campusgigs

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusgigs}
    username: ${DB_USER:campusgigs}
    password: ${DB_PASSWORD:campusgigs}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

rsa:
  private-key: ${RSA_PRIVATE_KEY:classpath:certs/private_key.pem}
  public-key: ${RSA_PUBLIC_KEY:classpath:certs/public_key.pem}

viacep:
  base-url: https://viacep.com.br/ws

springdoc:
  swagger-ui:
    path: /swagger-ui.html
